[package]
name = "bex-test-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
factory-validator = { path = "../factory-validator" }
serde = { version = "1.0.229", features = ["derive"] }
