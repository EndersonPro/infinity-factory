name: Release BEX Factory

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned component tooling
        run: cargo install cargo-component --version 0.21.1 --locked
      - run: ./scripts/check.sh
      - run: ./scripts/build-plugins.sh
        env:
          ALLOW_WASIP2_FALLBACK: "0"
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != v* || "$TAG" == "v" ]]; then
            echo "Release tag must start with v and contain a version (received: $TAG)" >&2
            exit 1
          fi
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate release assets" >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.bex dist/bex-factory.json repository.json --target "$GITHUB_SHA" --generate-notes
