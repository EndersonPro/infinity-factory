name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ./scripts/check.sh

  component-and-bex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned component tooling
        run: cargo install cargo-component --version 0.21.1 --locked
      - name: Build and validate plugin sources
        run: ./scripts/build-plugins.sh
        env:
          ALLOW_WASIP2_FALLBACK: "0"
      - name: Stage canonical tracked release assets
        run: ./scripts/stage-release-assets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bex-factory
          path: dist/
          if-no-files-found: error
